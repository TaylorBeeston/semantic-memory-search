[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-memory-search"
version = "0.1.0"
description = "Local semantic search for AI agent memory files with MCP server support"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Computer"}
]
keywords = ["semantic-search", "memory", "embeddings", "mcp", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "sentencepiece",
    "safetensors",
    "numpy",
    "click",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0.0",
]
dev = [
    "pytest",
    "black",
    "ruff",
]

[project.scripts]
semantic-memory = "semantic_memory.cli:main"
semantic-memory-mcp = "mcp_server:main"

[project.urls]
Homepage = "https://github.com/computer/semantic-memory-search"
Documentation = "https://github.com/computer/semantic-memory-search/blob/main/README.md"
Repository = "https://github.com/computer/semantic-memory-search"
